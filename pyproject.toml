[project]
name = "funai"
version = "1.0.12"
description = "大模型统一调用封装：基于 OpenAI 兼容接口接入 DeepSeek、Moonshot，API Key 由 funsecret 管理"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [ "funsecret>=1.4.84", "farlog>=1.1.7", "openai>=1.0.0",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funai"
Releases = "https://github.com/farfarfun/funai/releases"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "pytest>=7.0.0", "ruff>=0.12.0",]

[tool.ruff]
target-version = "py310"
src = [ "src",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM", "RUF",]
# RUF001-003：docstring 与日志文案是中文，全角标点是有意使用的。
ignore = [ "RUF001", "RUF002", "RUF003",]
